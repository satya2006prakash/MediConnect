<!DOCTYPE html>
<html lang=en>
<head>
  <meta charset=UTF-8>
  <meta name=viewport content=width=device-width, initial-scale=1.0>
  <title>Offline – MediConnect</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: #F8FAFC;
      color: #1E293B;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0D1117; color: #F0F6FC; }
      .card { background: #161B22 !important; border-color: #30363D !important; }
      .subtext { color: #8B949E !important; }
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      padding: 36px 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      background: #EEF4FC;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      color: #64748B;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 11px 20px;
      background: #2457A7;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover { background: #1A4482; }
  </style>
</head>
<body>
  <div class=card>
    <div class=icon>📡</div>
    <h1>You are currently offline</h1>
    <p class=subtext>MediConnect needs an internet connection to sync your live medicine inventory and prescription orders. We will automatically reconnect as soon as your network returns.</p>
    <button class=btn onclick=window.location.reload()>Retry Connection</button>
  </div>
</body>
</html>
